<section>
    @for(product of products ; track $index ){
    <div class="card">
        <div class="img">
            <img [src]="product.image" alt="">
        </div>
        <h2>{{product.name}}</h2>
        <div class="price">
            <p>{{product.price}}</p>
            @if (product.avalible) {
            <button>Comprar</button>
            }@else{
                <button class="disable" disabled>comprar</button>
            }
        </div>
    </div>



    }
</section>
